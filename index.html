<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GERADOR DE DADOS - V31</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #0a0a0a; --card: #161616; --text: #eee; --green: #00ff41; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        #bloqueio { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #conteudo { display: none; max-width: 900px; margin: 0 auto; }
        
        .count-badge { border: 1px solid var(--primary); color: var(--primary); padding: 8px 20px; border-radius: 50px; font-size: 1rem; display: inline-block; margin-bottom: 15px; }
        .tabs-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 10px 0; border-bottom: 1px solid #222; }
        .tab-btn { background: #222; color: #888; border: 1px solid #333; padding: 8px 15px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .pacote { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid var(--primary); position: relative; }
        .pacote.mae { border-left-color: #ff9800; background: #221a05; }
        
        .divisor-banco { background: #333; color: #fff; padding: 10px 15px; border-radius: 5px; margin: 25px 0 10px 0; font-size: 0.9rem; text-transform: uppercase; border-left: 5px solid var(--primary); }

        p { margin: 10px 0; border-bottom: 1px solid #222; padding-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        b { color: var(--primary); width: 100px; font-size: 0.75rem; text-transform: uppercase; font-weight: normal; }
        span { font-family: monospace; font-size: 0.95rem; color: #fff; flex-grow: 1; }
        
        /* CAIXINHA VERDE PARA DIGITAR */
        .input-banco-custom { 
            background: transparent; 
            border: 1px solid var(--green); 
            color: var(--green); 
            border-radius: 4px; 
            padding: 4px 8px; 
            font-size: 0.85rem; 
            font-family: monospace;
            width: 200px;
            outline: none;
        }
        .input-banco-custom:focus { background: #00ff4111; }

        button { cursor: pointer; border: none; border-radius: 6px; padding: 6px 10px; font-size: 0.7rem; font-weight: normal; }
        .btn-gen { background: var(--primary); color: white; padding: 12px 20px; }
        .btn-copy { background: #333; color: #ccc; }
        .btn-del { background: #3d0000; color: #ff4d4d; }
        
        select { padding: 6px; border-radius: 6px; border: 1px solid #444; background: #111; color: white; font-size: 0.8rem; width: 130px; }
    </style>
</head>
<body>

    <div id="bloqueio">
        <h1 style="font-weight: normal; color: var(--primary);">DARCK METODOS</h1>
        <input type="password" id="senhaInput" placeholder="PIN" style="text-align:center">
        <button class="btn-gen" style="margin-top:10px" onclick="verificarSenha()">ENTRAR</button>
    </div>

    <div id="conteudo">
        <center><div id="contador" class="count-badge">Contas: 0</div></center>
        <div class="tabs-container" id="tabsCategorias"></div>
        <div style="text-align:center; margin-bottom: 20px;">
            <button class="btn-gen" onclick="gerarPacote()">GERAR NOVO DADO</button>
        </div>
        <div id="lista">Sincronizando...</div>
    </div>

<script>
    const BANCOS_LISTA = ["Nubank", "Mercado Pago", "PagBank", "PicPay", "Inter", "C6 Bank", "Caixa"];
    const firebaseConfig = { databaseURL: "https://gerador-by-darck-default-rtdb.firebaseio.com/" };
    
    let categoriaAtual = "TODOS";
    let dadosGlobais = {};

    function verificarSenha() {
        if (document.getElementById("senhaInput").value === "2323") {
            document.getElementById("bloqueio").style.display = "none";
            document.getElementById("conteudo").style.display = "block";
            iniciarApp();
        }
    }

    function iniciarApp() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        firebase.database().ref("pacotes").on("value", (snapshot) => {
            dadosGlobais = snapshot.val() || {};
            renderizarLista();
        });
    }

    function detectarCategoria(texto) {
        if (!texto || texto === "SELECIONE") return "Outros";
        for (let b of BANCOS_LISTA) {
            if (texto.toUpperCase().includes(b.toUpperCase())) return b;
        }
        return "Personalizado";
    }

    function renderizarLista() {
        const listaDiv = document.getElementById("lista");
        const tabsDiv = document.getElementById("tabsCategorias");
        listaDiv.innerHTML = "";
        
        let counts = { TODOS: 0, Outros: 0, Personalizado: 0 };
        BANCOS_LISTA.forEach(b => counts[b] = 0);

        let arrayContas = Object.keys(dadosGlobais).map(id => {
            const cat = detectarCategoria(dadosGlobais[id].banco);
            return { id, ...dadosGlobais[id], categoria: cat };
        });

        arrayContas.forEach(p => { counts.TODOS++; counts[p.categoria]++; });
        document.getElementById("contador").innerText = `Contas: ${counts.TODOS}`;

        let tabsHtml = `<button class="tab-btn ${categoriaAtual==='TODOS'?'active':''}" onclick="categoriaAtual='TODOS';renderizarLista()">TODOS (${counts.TODOS})</button>`;
        BANCOS_LISTA.forEach(b => { if(counts[b] > 0) tabsHtml += `<button class="tab-btn ${categoriaAtual===b?'active':''}" onclick="categoriaAtual='${b}';renderizarLista()">${b.toUpperCase()} (${counts[b]})</button>`; });
        if(counts.Personalizado > 0) tabsHtml += `<button class="tab-btn ${categoriaAtual==='Personalizado'?'active':''}" onclick="categoriaAtual='Personalizado';renderizarLista()">PERS. (${counts.Personalizado})</button>`;
        tabsDiv.innerHTML = tabsHtml;

        let ultimoB = "";
        arrayContas.sort((a,b) => a.categoria.localeCompare(b.categoria)).forEach(p => {
            if (categoriaAtual !== "TODOS" && categoriaAtual !== p.categoria) return;

            if (p.categoria !== ultimoB) {
                const divSep = document.createElement("div");
                divSep.className = "divisor-banco";
                divSep.innerHTML = p.categoria;
                listaDiv.appendChild(divSep);
                ultimoB = p.categoria;
            }

            const div = document.createElement("div");
            div.className = `pacote ${p.mae ? 'mae' : ''}`;
            
            // Verifica qual banco marcar no Select
            let bancoNoSelect = "SELECIONE";
            for(let b of BANCOS_LISTA) { if(p.banco.toUpperCase().includes(b.toUpperCase())) { bancoNoSelect = b; break; } }

            div.innerHTML = `
                <p>
                    <b>Banco:</b> 
                    <select onchange="atualizar('${p.id}', 'banco', this.value)">
                        <option value="SELECIONE" ${bancoNoSelect === 'SELECIONE' ? 'selected' : ''}>SELECIONE</option>
                        ${BANCOS_LISTA.map(b => `<option value="${b}" ${bancoNoSelect === b ? 'selected' : ''}>${b}</option>`).join('')}
                    </select>
                    <input type="text" class="input-banco-custom" placeholder="Personalizar..." 
                        value="${p.banco === 'SELECIONE' ? '' : p.banco}" 
                        onchange="atualizar('${p.id}', 'banco', this.value)">
                </p>
                <p><b>Nome:</b> <span>${p.nome}</span> <button class="btn-copy" onclick="copiar(this)">Copiar</button></p>
                <p><b>CPF:</b> <span>${p.cpf}</span> <button class="btn-copy" onclick="copiar(this, 'LIMPO')">Copiar</button></p>
                <p><b>Senha S:</b> <span style="color:var(--green)">${p.senhaSimples || '123456'}</span> <button class="btn-copy" onclick="copiar(this)">Copiar</button></p>
                <div style="display:flex; gap:10px; margin-top:10px">
                    <button style="flex:2; background:${p.mae?'#ff9800':'#333'}; color:white;" onclick="atualizar('${p.id}', 'mae', ${!p.mae})">${p.mae?'★ MÃE ATIVA':'MARCAR MÃE'}</button>
                    <button class="btn-del" onclick="excluir('${p.id}')">EXCLUIR</button>
                </div>`;
            listaDiv.appendChild(div);
        });
    }

    window.atualizar = (id, campo, valor) => firebase.database().ref(`pacotes/${id}`).update({[campo]: valor});
    window.excluir = (id) => { if(confirm("Apagar permanentemente?")) firebase.database().ref(`pacotes/${id}`).remove(); };

    window.gerarPacote = async () => {
        await firebase.database().ref("pacotes").push({
            nome: "Usuario " + Math.floor(Math.random()*999),
            cpf: Math.floor(Math.random()*99999999999).toString(), 
            banco: "SELECIONE", senhaSimples: "123456", mae: false
        });
    };

    function copiar(btn, tipo) {
        let t = btn.parentElement.querySelector("span").innerText;
        if (tipo === 'LIMPO') t = t.replace(/\D/g, '');
        navigator.clipboard.writeText(t);
        let o = btn.innerText; btn.innerText = "OK"; setTimeout(() => btn.innerText = o, 800);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DARCK METODOS - INFINITE CLOUD</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #0a0a0a; --card: #161616; --text: #eee; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        #bloqueio { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #conteudo { display: none; max-width: 900px; margin: 0 auto; }
        .controls { background: var(--card); padding: 20px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; border: 1px solid #222; justify-content: center; margin-bottom: 20px;}
        .pacote { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid var(--primary); position: relative; }
        .pacote.mae { border-left-color: #ff9800; background: #221a05; }
        p { margin: 10px 0; border-bottom: 1px solid #222; padding-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        b { color: var(--primary); width: 130px; font-size: 0.8rem; text-transform: uppercase; }
        span { font-family: monospace; font-size: 1rem; color: #fff; flex-grow: 1; }
        button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 12px; font-weight: bold; transition: 0.2s; }
        .btn-gen { background: var(--primary); color: white; padding: 12px 20px; }
        .btn-copy { background: #333; color: #ccc; font-size: 0.7rem; }
        .btn-del { background: #3d0000; color: #ff4d4d; }
        select.bank-selector { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 5px; border-radius: 4px; }
        input, select { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #111; color: white; }
    </style>
</head>
<body>

    <div id="bloqueio">
        <h1 style="color:var(--primary)">DARCK METODOS</h1>
        <input type="password" id="senhaInput" placeholder="Senha" style="text-align:center">
        <button class="btn-gen" style="margin-top:10px" onclick="verificarSenha()">ENTRAR</button>
    </div>

    <div id="conteudo">
        <div class="controls">
            <select id="generoGen">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
            </select>
            <button class="btn-gen" id="btnGerar" onclick="gerarPacote()">GERAR CONTA ÚNICA</button>
            <button onclick="limparBanco()" style="background:#222; color:#777;">LIMPAR TUDO</button>
        </div>
        <div id="lista">Conectando...</div>
    </div>

<script>
    // ADICIONE OU REMOVA BANCOS AQUI
    const BANCOS = ["Nubank", "Mercado Pago", "PagBank", "PicPay", "Inter", "C6 Bank", "Caixa"];
    
    const SENHA_ACESSO = "2323";
    const firebaseConfig = { databaseURL: "https://gerador-by-darck-default-rtdb.firebaseio.com/" };

    const nomesM = ["Gabriel", "Lucas", "Matheus", "Pedro", "Rafael", "João", "Felipe", "Bruno", "Tiago", "Rodrigo", "André", "Leonardo", "Vinícius", "Eduardo", "Diego", "Samuel"];
    const nomesF = ["Ana", "Maria", "Juliana", "Camila", "Fernanda", "Beatriz", "Larissa", "Patrícia", "Aline", "Letícia", "Amanda", "Vanessa", "Jessica", "Isabela", "Giovanna"];
    const sobrenomes = ["Silva", "Santos", "Oliveira", "Souza", "Pereira", "Lima", "Carvalho", "Ferreira", "Rodrigues", "Almeida", "Costa", "Nascimento", "Gomes", "Martins", "Araújo"];

    function verificarSenha() {
        if (document.getElementById("senhaInput").value === SENHA_ACESSO) {
            document.getElementById("bloqueio").style.display = "none";
            document.getElementById("conteudo").style.display = "block";
            iniciarApp();
        }
    }

    function iniciarApp() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref("pacotes").on("value", (snapshot) => {
            const listaDiv = document.getElementById("lista");
            listaDiv.innerHTML = "";
            const data = snapshot.val();
            if (!data) return listaDiv.innerHTML = "<center>Nenhum dado salvo.</center>";

            Object.keys(data).reverse().forEach(id => {
                const p = data[id];
                const div = document.createElement("div");
                div.className = `pacote ${p.mae ? 'mae' : ''}`;
                div.innerHTML = `
                    <p><b>Banco:</b> 
                        <select class="bank-selector" onchange="atualizar('${id}', 'banco', this.value)">
                            ${BANCOS.map(b => `<option value="${b}" ${p.banco === b ? 'selected' : ''}>${b}</option>`).join('')}
                        </select>
                    </p>
                    <p><b>Nome:</b> <span>${p.nome}</span> <button class="btn-copy" onclick="copiar(this)">Copiar</button></p>
                    <p><b>CPF:</b> <span>${p.cpf}</span> <button class="btn-copy" onclick="copiar(this, 'CPF')">Copiar</button></p>
                    <p><b>Login:</b> <span>${p.login}</span> <button class="btn-copy" onclick="copiar(this)">Copiar</button></p>
                    <p><b>Senha:</b> <span>${p.senhaForte}</span> <button class="btn-copy" onclick="copiar(this)">Copiar</button></p>
                    <p><b>Saque:</b> <span>${p.senhaSaque}</span> <button class="btn-copy" onclick="copiar(this)">Copiar</button></p>
                    <div style="display:flex; gap:10px; margin-top:10px">
                        <button style="flex:2; background:${p.mae?'#ff9800':'#333'}; color:white;" onclick="atualizar('${id}', 'mae', ${!p.mae})">${p.mae?'★ MÃE ATIVA':'MARCAR MÃE'}</button>
                        <button class="btn-del" onclick="excluir('${id}')">EXCLUIR</button>
                    </div>`;
                listaDiv.appendChild(div);
            });
        });

        window.gerarPacote = async () => {
            const btn = document.getElementById("btnGerar");
            btn.innerText = "VERIFICANDO UNICIDADE...";
            btn.disabled = true;

            const gen = document.getElementById("generoGen").value;
            const listaN = gen === 'masculino' ? nomesM : nomesF;
            
            // Gerar dados únicos
            let cpfUnico = false;
            let novoCpf;
            
            // Loop de Proteção: Só sai quando o CPF for realmente novo
            while (!cpfUnico) {
                novoCpf = gerarCpfReal();
                const snap = await db.ref("pacotes").orderByChild("cpf").equalTo(novoCpf).once("value");
                if (!snap.exists()) cpfUnico = true;
            }

            const nomeComp = `${random(listaN)} ${random(sobrenomes)} ${random(sobrenomes)}`;
            const login = nomeComp.split(' ')[0].toLowerCase() + Math.floor(1000 + Math.random() * 9000);

            const novo = {
                nome: nomeComp,
                cpf: novoCpf,
                telefone: "119" + Math.floor(10000000 + Math.random() * 90000000),
                login: login,
                senhaForte: Math.random().toString(36).slice(-10).toUpperCase(),
                senhaSaque: Math.floor(100000 + Math.random() * 900000),
                banco: BANCOS[0],
                mae: false
            };

            await db.ref("pacotes").push(novo);
            btn.innerText = "GERAR CONTA ÚNICA";
            btn.disabled = false;
        };

        window.atualizar = (id, campo, valor) => db.ref(`pacotes/${id}`).update({ [campo]: valor });
        window.excluir = (id) => db.ref(`pacotes/${id}`).remove();
        window.limparBanco = () => { if(confirm("Zerar Nuvem?")) db.ref("pacotes").remove(); };
    }

    function gerarCpfReal() {
        const n = () => Math.floor(Math.random() * 9);
        let n1=n(), n2=n(), n3=n(), n4=n(), n5=n(), n6=n(), n7=n(), n8=n(), n9=n();
        let d1 = n9*2+n8*3+n7*4+n6*5+n5*6+n4*7+n3*8+n2*9+n1*10;
        d1 = 11 - (d1 % 11); if (d1 >= 10) d1 = 0;
        let d2 = d1*2+n9*3+n8*4+n7*5+n6*6+n5*7+n4*8+n3*9+n2*10+n1*11;
        d2 = 11 - (d2 % 11); if (d2 >= 10) d2 = 0;
        return `${n1}${n2}${n3}.${n4}${n5}${n6}.${n7}${n8}${n9}-${d1}${d2}`;
    }

    function random(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function copiar(btn, tipo) {
        let txt = btn.parentElement.querySelector("span").innerText;
        if(tipo === 'CPF') txt = txt.replace(/\D/g, '');
        navigator.clipboard.writeText(txt);
        const original = btn.innerText;
        btn.innerText = "OK";
        setTimeout(() => btn.innerText = original, 800);
    }
</script>
</body>
</html>

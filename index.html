<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DARCK METODOS - V7 ULTIMATE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #0a0a0a; --card: #161616; --text: #eee; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        #bloqueio { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #conteudo { display: none; max-width: 900px; margin: 0 auto; }
        .controls { background: var(--card); padding: 20px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; border: 1px solid #222; justify-content: center; margin-bottom: 20px; }
        .pacote { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid var(--primary); transition: 0.3s; }
        .pacote.mae { border-left-color: #ff9800; background: #221a05; }
        p { margin: 10px 0; border-bottom: 1px solid #222; padding-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        b { color: var(--primary); width: 130px; font-size: 0.75rem; text-transform: uppercase; }
        span { font-family: monospace; font-size: 0.95rem; color: #fff; flex-grow: 1; word-break: break-all; }
        button { cursor: pointer; border: none; border-radius: 6px; padding: 6px 10px; font-weight: bold; transition: 0.2s; font-size: 0.7rem; }
        .btn-gen { background: var(--primary); color: white; padding: 12px 20px; font-size: 0.8rem; }
        .btn-copy { background: #333; color: #ccc; }
        .btn-edit { background: #222; color: #666; border: 1px solid #333; }
        .btn-edit:hover { border-color: var(--primary); color: var(--primary); }
        .btn-del { background: #3d0000; color: #ff4d4d; }
        select.bank-selector { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 5px; border-radius: 4px; font-weight: bold; max-width: 150px; }
        input, select { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #111; color: white; }
        .count-badge { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; margin-bottom: 15px; display: inline-block; }
    </style>
</head>
<body>

    <div id="bloqueio">
        <h1 style="color:var(--primary)">DARCK METODOS</h1>
        <input type="password" id="senhaInput" placeholder="PIN" style="text-align:center">
        <button class="btn-gen" style="margin-top:10px; width:180px" onclick="verificarSenha()">ENTRAR</button>
    </div>

    <div id="conteudo">
        <center><div id="contador" class="count-badge">Contas na Nuvem: 0</div></center>
        <div class="controls">
            <select id="generoGen">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
            </select>
            <button class="btn-gen" id="btnGerar" onclick="gerarPacote()">GERAR CONTA ÚNICA</button>
            <button style="background:#444; color:white;" onclick="exportarBanco()">EXPORTAR</button>
            <button style="background:#444; color:white;" onclick="document.getElementById('fileIn').click()">IMPORTAR</button>
            <input type="file" id="fileIn" style="display:none" onchange="importarBanco(event)">
            <button onclick="limparBanco()" style="background:#222; color:#777;">LIMPAR TUDO</button>
        </div>
        <div id="lista">Conectando...</div>
    </div>

<script>
    const BANCOS_PADRAO = ["Nubank", "Mercado Pago", "PagBank", "PicPay", "Inter", "C6 Bank", "Caixa"];
    const DDDs = ["11","19","21","31","41","51","61","71","81","91"];
    const SENHA_ACESSO = "2323";
    const firebaseConfig = { databaseURL: "https://gerador-by-darck-default-rtdb.firebaseio.com/" };

    const nomesM = ["Gabriel", "Lucas", "Matheus", "Pedro", "Rafael", "João", "Felipe", "Bruno", "Tiago", "Rodrigo"];
    const nomesF = ["Ana", "Maria", "Juliana", "Camila", "Fernanda", "Beatriz", "Larissa", "Patrícia", "Aline", "Letícia"];
    const sobrenomes = ["Silva", "Santos", "Oliveira", "Souza", "Pereira", "Lima", "Carvalho", "Ferreira", "Rodrigues", "Almeida"];

    function verificarSenha() {
        if (document.getElementById("senhaInput").value === SENHA_ACESSO) {
            document.getElementById("bloqueio").style.display = "none";
            document.getElementById("conteudo").style.display = "block";
            iniciarApp();
        }
    }

    function iniciarApp() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref("pacotes").on("value", (snapshot) => {
            const listaDiv = document.getElementById("lista");
            const contadorDiv = document.getElementById("contador");
            listaDiv.innerHTML = "";
            const data = snapshot.val();
            
            if (!data) {
                contadorDiv.innerText = "Contas na Nuvem: 0";
                return listaDiv.innerHTML = "<center>Nenhum dado salvo.</center>";
            }

            const keys = Object.keys(data).reverse();
            contadorDiv.innerText = `Contas na Nuvem: ${keys.length}`;

            keys.forEach(id => {
                const p = data[id];
                const div = document.createElement("div");
                div.className = `pacote ${p.mae ? 'mae' : ''}`;
                
                const campos = [
                    {l: 'Nome', v: p.nome, k: 'nome', t: 'NOME'},
                    {l: 'CPF', v: p.cpf, k: 'cpf', t: 'LIMPO'},
                    {l: 'Telefone', v: p.telefone, k: 'telefone', t: 'LIMPO'},
                    {l: 'Chave PIX', v: p.pix || p.cpf, k: 'pix', t: 'LIMPO'},
                    {l: 'Login', v: p.login, k: 'login', t: 'PADRAO'},
                    {l: 'Senha Forte', v: p.senhaForte, k: 'senhaForte', t: 'PADRAO'},
                    {l: 'Senha Simples', v: p.senhaSimples, k: 'senhaSimples', t: 'PADRAO'},
                    {l: 'Saque', v: p.senhaSaque, k: 'senhaSaque', t: 'PADRAO'}
                ];

                let htmlCampos = `<p><b>Banco:</b> 
                    <select class="bank-selector" onchange="atualizar('${id}', 'banco', this.value)">
                        <option value="${p.banco}">${p.banco}</option>
                        ${BANCOS_PADRAO.filter(b => b !== p.banco).map(b => `<option value="${b}">${b}</option>`).join('')}
                    </select>
                    <button class="btn-edit" onclick="abrirEdicao('${id}', 'banco', '${p.banco}')">Personalizar</button>
                    <button class="btn-copy" onclick="copiar(this, 'PADRAO')">Copiar</button>
                </p>`;

                campos.forEach(c => {
                    htmlCampos += `<p><b>${c.l}:</b> <span>${c.v}</span> 
                        <button class="btn-edit" onclick="abrirEdicao('${id}', '${c.k}', '${c.v}')">Edit</button>
                        <button class="btn-copy" onclick="copiar(this, '${c.t}')">Copiar</button></p>`;
                });

                div.innerHTML = htmlCampos + `
                    <div style="display:flex; gap:10px; margin-top:10px">
                        <button style="flex:2; background:${p.mae?'#ff9800':'#333'}; color:white;" onclick="atualizar('${id}', 'mae', ${!p.mae})">${p.mae?'★ MÃE ATIVA':'MARCAR MÃE'}</button>
                        <button class="btn-del" onclick="excluir('${id}')">EXCLUIR</button>
                    </div>`;
                listaDiv.appendChild(div);
            });
        });

        window.abrirEdicao = (id, campo, valor) => {
            const novo = prompt(`Editar ${campo.toUpperCase()}:`, valor);
            if (novo !== null && novo !== "") atualizar(id, campo, novo);
        };

        window.gerarPacote = async () => {
            const btn = document.getElementById("btnGerar");
            btn.innerText = "GERANDO..."; btn.disabled = true;
            const gen = document.getElementById("generoGen").value;
            const listaN = gen === 'masculino' ? nomesM : nomesF;
            
            let novoCpf;
            let cpfUnico = false;
            while(!cpfUnico){
                novoCpf = gerarCpfReal();
                const snap = await db.ref("pacotes").orderByChild("cpf").equalTo(novoCpf).once("value");
                if(!snap.exists()) cpfUnico = true;
            }

            const nomeFinal = `${random(listaN)} ${random(sobrenomes)} ${random(sobrenomes)}`;
            const ddd = random(["11","21","31","41","51","61","71","81","91","19"]);

            const novo = {
                nome: nomeFinal,
                cpf: novoCpf,
                telefone: `(${ddd}) 9${Math.floor(10000000 + Math.random() * 90000000)}`,
                pix: novoCpf,
                login: nomeFinal.split(' ')[0].toLowerCase() + Math.floor(1000 + Math.random() * 8999),
                senhaForte: gerarSenha(12, true),
                senhaSimples: gerarSenha(10, false),
                senhaSaque: Math.floor(100000 + Math.random() * 899999),
                banco: BANCOS_PADRAO[0],
                mae: false
            };

            await db.ref("pacotes").push(novo);
            btn.innerText = "GERAR CONTA ÚNICA"; btn.disabled = false;
        };

        window.exportarBanco = () => {
            db.ref("pacotes").once("value", s => {
                const blob = new Blob([JSON.stringify(s.val(),null,2)], {type:"application/json"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `backup_contas.json`; a.click();
            });
        };

        window.importarBanco = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const dados = JSON.parse(ev.target.result);
                const loop = dados.import_manual || dados;
                Object.keys(loop).forEach(k => db.ref("pacotes").push(loop[k]));
                alert("Importado!");
            };
            reader.readAsText(e.target.files[0]);
        };

        window.atualizar = (id, campo, valor) => db.ref(`pacotes/${id}`).update({[campo]: valor});
        window.excluir = (id) => { if(confirm("Apagar?")) db.ref(`pacotes/${id}`).remove(); };
        window.limparBanco = () => { if(confirm("Zerar tudo?")) db.ref("pacotes").remove(); };
    }

    function gerarSenha(t, s) {
        let c = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        if(s) c += "!@#$%&*";
        let r = "";
        for(let i=0; i<t; i++) r += c.charAt(Math.floor(Math.random()*c.length));
        return r;
    }

    function gerarCpfReal() {
        const n = () => Math.floor(Math.random() * 9);
        let n1=n(),n2=n(),n3=n(),n4=n(),n5=n(),n6=n(),n7=n(),n8=n(),n9=n();
        let d1 = n9*2+n8*3+n7*4+n6*5+n5*6+n4*7+n3*8+n2*9+n1*10;
        d1 = 11 - (d1 % 11); if (d1 >= 10) d1 = 0;
        let d2 = d1*2+n9*3+n8*4+n7*5+n6*6+n5*7+n4*8+n3*9+n2*10+n1*11;
        d2 = 11 - (d2 % 11); if (d2 >= 10) d2 = 0;
        return `${n1}${n2}${n3}.${n4}${n5}${n6}.${n7}${n8}${n9}-${d1}${d2}`;
    }

    function random(a) { return a[Math.floor(Math.random()*a.length)]; }

    function copiar(btn, tipo) {
        let span = btn.parentElement.querySelector("span");
        let t = span ? span.innerText : btn.parentElement.querySelector("select").value;
        if (tipo === 'NOME') {
            t = t.replace(/^\d+\s+/, '');
        } else if (tipo === 'LIMPO') {
            t = t.replace(/\D/g, '');
        }
        navigator.clipboard.writeText(t);
        const o = btn.innerText; btn.innerText = "OK";
        setTimeout(() => btn.innerText = o, 800);
    }
</script>
</body>
</html>

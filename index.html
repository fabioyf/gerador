<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GERADOR DE DADOS</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #0a0a0a; --card: #161616; --text: #eee; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        #bloqueio { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #conteudo { display: none; max-width: 900px; margin: 0 auto; }
        
        /* Menu de Categorias */
        .tabs-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 10px 0; border-bottom: 1px solid #222; }
        .tab-btn { background: #222; color: #888; border: 1px solid #333; padding: 8px 15px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; box-shadow: 0 0 10px rgba(0,123,255,0.4); }
        .tab-btn span { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; margin-left: 5px; font-size: 0.65rem; }

        .controls { background: var(--card); padding: 20px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; border: 1px solid #222; justify-content: center; margin-bottom: 20px; }
        .pacote { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid var(--primary); transition: 0.3s; position: relative; }
        .pacote.mae { border-left-color: #ff9800; background: #221a05; }
        
        /* Separador Visual de Banco */
        .divisor-banco { background: #333; color: #fff; padding: 5px 15px; border-radius: 5px; margin: 20px 0 10px 0; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-left: 4px solid #fff; }

        .btn-bonus { position: absolute; top: 15px; right: 15px; background: #fff; color: #000; padding: 5px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 5px; }
        .btn-bonus.coletado { background: #28a745; color: #fff; }

        p { margin: 10px 0; border-bottom: 1px solid #222; padding-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        b { color: var(--primary); width: 130px; font-size: 0.75rem; text-transform: uppercase; }
        span { font-family: monospace; font-size: 0.95rem; color: #fff; flex-grow: 1; word-break: break-all; }
        button { cursor: pointer; border: none; border-radius: 6px; padding: 6px 10px; font-weight: bold; transition: 0.2s; font-size: 0.7rem; }
        .btn-gen { background: var(--primary); color: white; padding: 12px 20px; font-size: 0.8rem; }
        .btn-copy { background: #333; color: #ccc; }
        .btn-edit { background: #222; color: #666; border: 1px solid #333; }
        .btn-del { background: #3d0000; color: #ff4d4d; }
        select.bank-selector { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 5px; border-radius: 4px; font-weight: bold; }
        input, select { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #111; color: white; }
        .count-badge { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; margin-bottom: 5px; display: inline-block; }
    </style>
</head>
<body>

    <div id="bloqueio">
        <h1 style="color:var(--primary)">DARCK METODOS</h1>
        <input type="password" id="senhaInput" placeholder="PIN" style="text-align:center">
        <button class="btn-gen" style="margin-top:10px; width:180px" onclick="verificarSenha()">ENTRAR</button>
    </div>

    <div id="conteudo">
        <center><div id="contador" class="count-badge">Carregando...</div></center>

        <div class="tabs-container" id="tabsCategorias">
            <button class="tab-btn active">TODOS <span>0</span></button>
        </div>

        <div class="controls">
            <select id="generoGen">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
            </select>
            <button class="btn-gen" id="btnGerar" onclick="gerarPacote()">GERAR CONTA ÚNICA</button>
            <button style="background:#444; color:white;" onclick="exportarBanco()">EXPORTAR</button>
            <button style="background:#444; color:white;" onclick="document.getElementById('fileIn').click()">IMPORTAR</button>
            <input type="file" id="fileIn" style="display:none" onchange="importarBanco(event)">
            <button onclick="limparBanco()" style="background:#222; color:#777;">LIMPAR TUDO</button>
        </div>
        <div id="lista">Conectando ao Firebase...</div>
    </div>

<script>
    const BANCOS_LISTA = ["Nubank", "Mercado Pago", "PagBank", "PicPay", "Inter", "C6 Bank", "Caixa", "Outros"];
    const SENHA_ACESSO = "2323";
    const firebaseConfig = { databaseURL: "https://gerador-by-darck-default-rtdb.firebaseio.com/" };
    
    let categoriaAtual = "TODOS";
    let dadosGlobais = {};

    function verificarSenha() {
        if (document.getElementById("senhaInput").value === SENHA_ACESSO) {
            document.getElementById("bloqueio").style.display = "none";
            document.getElementById("conteudo").style.display = "block";
            iniciarApp();
        }
    }

    function detectarBancoPrincipal(nomeBanco) {
        if(!nomeBanco) return "Outros";
        const nomeBaixo = nomeBanco.toLowerCase();
        for (let b of BANCOS_LISTA) {
            if (nomeBaixo.includes(b.toLowerCase())) return b;
        }
        return "Outros";
    }

    function filtrarCategoria(cat) {
        categoriaAtual = cat;
        renderizarLista();
    }

    function iniciarApp() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        db.ref("pacotes").on("value", (snapshot) => {
            dadosGlobais = snapshot.val() || {};
            renderizarLista();
        });
    }

    function renderizarLista() {
        const listaDiv = document.getElementById("lista");
        const tabsDiv = document.getElementById("tabsCategorias");
        const contadorDiv = document.getElementById("contador");
        listaDiv.innerHTML = "";
        
        let counts = { TODOS: 0 };
        BANCOS_LISTA.forEach(b => counts[b] = 0);

        // Converter objeto em array para poder ordenar
        let arrayContas = Object.keys(dadosGlobais).map(id => {
            return { id, ...dadosGlobais[id], bPrincipal: detectarBancoPrincipal(dadosGlobais[id].banco) };
        });

        // --- LÓGICA DE ORDENAÇÃO ---
        // 1. Organiza por Banco (A-Z)
        // 2. Se for o mesmo banco, organiza por ID (mais novos primeiro)
        arrayContas.sort((a, b) => {
            if (a.bPrincipal < b.bPrincipal) return -1;
            if (a.bPrincipal > b.bPrincipal) return 1;
            return b.id.localeCompare(a.id); 
        });

        // Contagem para as abas
        arrayContas.forEach(p => {
            counts.TODOS++;
            counts[p.bPrincipal]++;
        });

        // Renderizar Abas
        let tabsHtml = `<button class="tab-btn ${categoriaAtual==='TODOS'?'active':''}" onclick="filtrarCategoria('TODOS')">TODOS <span>${counts.TODOS}</span></button>`;
        BANCOS_LISTA.forEach(b => {
            if(counts[b] > 0 || b === "Outros") {
                tabsHtml += `<button class="tab-btn ${categoriaAtual===b?'active':''}" onclick="filtrarCategoria('${b}')">${b.toUpperCase()} <span>${counts[b]}</span></button>`;
            }
        });
        tabsDiv.innerHTML = tabsHtml;
        contadorDiv.innerText = `Contas na Nuvem: ${counts.TODOS}`;

        let ultimoBancoRenderizado = "";

        // Renderizar Cards
        arrayContas.forEach(p => {
            if (categoriaAtual !== "TODOS" && categoriaAtual !== p.bPrincipal) return;

            // Adiciona divisor visual se o banco mudar (apenas na aba TODOS)
            if (categoriaAtual === "TODOS" && p.bPrincipal !== ultimoBancoRenderizado) {
                const divSep = document.createElement("div");
                divSep.className = "divisor-banco";
                divSep.innerText = p.bPrincipal;
                listaDiv.appendChild(divSep);
                ultimoBancoRenderizado = p.bPrincipal;
            }

            const div = document.createElement("div");
            div.className = `pacote ${p.mae ? 'mae' : ''}`;
            div.innerHTML = `
                <div class="btn-bonus ${p.bonus ? 'coletado' : ''}" onclick="atualizar('${p.id}', 'bonus', ${!p.bonus})">
                    ${p.bonus ? 'BÔNUS COLETADO' : 'BÔNUS'}
                </div>
                <p><b>Banco:</b> 
                    <select class="bank-selector" onchange="atualizar('${p.id}', 'banco', this.value)">
                        <option value="${p.banco}">${p.banco}</option>
                        ${BANCOS_LISTA.filter(b => b !== p.banco && b !== "Outros").map(b => `<option value="${b}">${b}</option>`).join('')}
                    </select>
                    <button class="btn-edit" onclick="abrirEdicao('${p.id}', 'banco', '${p.banco}')">Personalizar</button>
                    <button class="btn-copy" onclick="copiar(this, 'PADRAO')">Copiar</button>
                </p>
                <p><b>Nome:</b> <span>${p.nome}</span> <button class="btn-copy" onclick="copiar(this, 'NOME')">Copiar</button></p>
                <p><b>CPF:</b> <span>${p.cpf}</span> <button class="btn-edit" onclick="abrirEdicao('${p.id}', 'cpf', '${p.cpf}')">Edit</button> <button class="btn-copy" onclick="copiar(this, 'LIMPO')">Copiar</button></p>
                <p><b>PIX:</b> <span>${p.pix || p.cpf}</span> <button class="btn-edit" onclick="abrirEdicao('${p.id}', 'pix', '${p.pix || p.cpf}')">Edit</button> <button class="btn-copy" onclick="copiar(this, 'LIMPO')">Copiar</button></p>
                <p><b>Login:</b> <span>${p.login}</span> <button class="btn-copy" onclick="copiar(this, 'PADRAO')">Copiar</button></p>
                <p><b>Senha F:</b> <span>${p.senhaForte}</span> <button class="btn-copy" onclick="copiar(this, 'PADRAO')">Copiar</button></p>
                <p><b>Senha S:</b> <span>${p.senhaSimples}</span> <button class="btn-copy" onclick="copiar(this, 'PADRAO')">Copiar</button></p>
                <p><b>Saque:</b> <span>${p.senhaSaque}</span> <button class="btn-copy" onclick="copiar(this, 'PADRAO')">Copiar</button></p>
                <div style="display:flex; gap:10px; margin-top:10px">
                    <button style="flex:2; background:${p.mae?'#ff9800':'#333'}; color:white;" onclick="atualizar('${p.id}', 'mae', ${!p.mae})">${p.mae?'★ MÃE ATIVA':'MARCAR MÃE'}</button>
                    <button class="btn-del" onclick="excluir('${p.id}')">EXCLUIR</button>
                </div>`;
            listaDiv.appendChild(div);
        });
    }

    // Funções auxiliares mantidas
    window.atualizar = (id, campo, valor) => firebase.database().ref(`pacotes/${id}`).update({[campo]: valor});
    window.excluir = (id) => { if(confirm("Apagar?")) firebase.database().ref(`pacotes/${id}`).remove(); };
    window.abrirEdicao = (id, campo, valor) => {
        const novo = prompt(`Editar ${campo.toUpperCase()}:`, valor);
        if (novo !== null && novo !== "") atualizar(id, campo, novo);
    };
    window.limparBanco = () => { if(confirm("Zerar tudo?")) firebase.database().ref("pacotes").remove(); };

    window.gerarPacote = async () => {
        const btn = document.getElementById("btnGerar");
        btn.innerText = "GERANDO..."; btn.disabled = true;
        const gen = document.getElementById("generoGen").value;
        const nomes = gen === 'masculino' ? ["Gabriel", "Lucas", "Matheus", "Pedro", "Rafael"] : ["Ana", "Maria", "Juliana", "Camila", "Fernanda"];
        const subs = ["Silva", "Santos", "Oliveira", "Souza", "Pereira"];
        const nomeFinal = `${nomes[Math.floor(Math.random()*nomes.length)]} ${subs[Math.floor(Math.random()*subs.length)]} ${subs[Math.floor(Math.random()*subs.length)]}`;
        const novoCpf = gerarCpfReal();
        await firebase.database().ref("pacotes").push({
            nome: nomeFinal, cpf: novoCpf, telefone: `(11) 9${Math.floor(10000000 + Math.random() * 90000000)}`,
            pix: novoCpf, login: nomeFinal.split(' ')[0].toLowerCase() + Math.floor(1000 + Math.random() * 8999),
            senhaForte: "Darck@"+Math.floor(1000+Math.random()*9000), senhaSimples: "dk"+Math.floor(100000+Math.random()*900000),
            senhaSaque: Math.floor(100000 + Math.random() * 899999), banco: "Nubank", mae: false, bonus: false
        });
        btn.innerText = "GERAR CONTA ÚNICA"; btn.disabled = false;
    };

    function gerarCpfReal() {
        const n = () => Math.floor(Math.random() * 9);
        let n1=n(),n2=n(),n3=n(),n4=n(),n5=n(),n6=n(),n7=n(),n8=n(),n9=n();
        let d1 = n9*2+n8*3+n7*4+n6*5+n5*6+n4*7+n3*8+n2*9+n1*10;
        d1 = 11 - (d1 % 11); if (d1 >= 10) d1 = 0;
        let d2 = d1*2+n9*3+n8*4+n7*5+n6*6+n5*7+n4*8+n3*9+n2*10+n1*11;
        d2 = 11 - (d2 % 11); if (d2 >= 10) d2 = 0;
        return `${n1}${n2}${n3}.${n4}${n5}${n6}.${n7}${n8}${n9}-${d1}${d2}`;
    }

    function copiar(btn, tipo) {
        let span = btn.parentElement.querySelector("span");
        let t = span ? span.innerText : btn.parentElement.querySelector("select").value;
        if (tipo === 'LIMPO') t = t.replace(/\D/g, '');
        navigator.clipboard.writeText(t);
        const o = btn.innerText; btn.innerText = "OK";
        setTimeout(() => btn.innerText = o, 800);
    }

    window.exportarBanco = () => {
        firebase.database().ref("pacotes").once("value", s => {
            const blob = new Blob([JSON.stringify(s.val(),null,2)], {type:"application/json"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `backup_nuvem.json`; a.click();
        });
    };

    window.importarBanco = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const dados = JSON.parse(ev.target.result);
            Object.keys(dados).forEach(k => firebase.database().ref("pacotes").push(dados[k]));
            alert("Importado!");
        };
        reader.readAsText(e.target.files[0]);
    };
</script>
</body>
</html>
